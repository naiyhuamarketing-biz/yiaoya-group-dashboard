# Render blueprint — Yiaoya Group dashboard
# Web service only on free tier (cron jobs require paid plan).
# Keep-alive ping handled by GitHub Actions (.github/workflows/keepalive.yml).
# No LINE integration in Yiaoya (ads-only build).
#
# Env vars set via Render dashboard (NOT committed):
#   FB_ACCESS_TOKEN, FB_APP_ID, FB_APP_SECRET
services:
  - type: web
    name: yiaoya-group
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TZ
        value: Asia/Bangkok
